name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat .source/part*.b64 | base64 --decode > /tmp/pocketot.zip
          unzip -q /tmp/pocketot.zip -d /tmp/pocketot
          test -f /tmp/pocketot/OT_Pocket_Android_v0.2/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: /tmp/pocketot/OT_Pocket_Android_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp /tmp/pocketot/OT_Pocket_Android_v0.2/app/build/outputs/apk/debug/app-debug.apk dist/PocketOT-v0.2-debug.apk
          sha256sum dist/PocketOT-v0.2-debug.apk > dist/PocketOT-v0.2-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.2-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
