name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat .source/part*.b64 | base64 --decode > /tmp/pocketot.zip
          unzip -q /tmp/pocketot.zip -d /tmp/pocketot
          test -f /tmp/pocketot/OT_Pocket_Android_v0.2/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: /tmp/pocketot/OT_Pocket_Android_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp /tmp/pocketot/OT_Pocket_Android_v0.2/app/build/outputs/apk/debug/app-debug.apk dist/PocketOT-v0.2-debug.apk
          sha256sum dist/PocketOT-v0.2-debug.apk > dist/PocketOT-v0.2-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.2-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in repository
        run: |
          mkdir -p release
          cp dist/PocketOT-v0.2-debug.apk release/PocketOT-v0.2-debug.apk
          cp dist/PocketOT-v0.2-debug.apk.sha256 release/PocketOT-v0.2-debug.apk.sha256
          {
            echo "PocketOT Android v0.2 development build"
            echo "Built from: $GITHUB_SHA"
            echo "Built at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Application ID: ca.otpocket.app.dev"
            echo "Minimum Android: 8.0 (API 26)"
            cat dist/PocketOT-v0.2-debug.apk.sha256
          } > release/BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          if ! git diff --cached --quiet; then
            git commit -m "release: publish PocketOT v0.2 debug APK [skip ci]"
            git push
          fi

      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2-dev >/dev/null 2>&1; then
            gh release edit v0.2-dev --target "$GITHUB_SHA" --title "PocketOT Android v0.2 Development Build" --notes "Installable development APK for PocketOT. Runs independently from a PC. Not yet intended as the sole clinical record." --prerelease
          else
            gh release create v0.2-dev --target "$GITHUB_SHA" --title "PocketOT Android v0.2 Development Build" --notes "Installable development APK for PocketOT. Runs independently from a PC. Not yet intended as the sole clinical record." --prerelease
          fi
          gh release upload v0.2-dev dist/PocketOT-v0.2-debug.apk dist/PocketOT-v0.2-debug.apk.sha256 --clobber
