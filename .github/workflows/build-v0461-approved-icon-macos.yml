name: Build PocketOT v0.4.6.1 Approved Icon APK on macOS

on:
  push:
    branches:
      - automation/pocketot-v0.4.6.1-icon-safezone
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0461-approved-icon-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out icon patch
        uses: actions/checkout@v4

      - name: Download verified v0.4.5 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pocketot /tmp/pocketot-v045-artifact
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8954524528/zip" \
            -o /tmp/pocketot-v045-artifact.zip
          unzip -q /tmp/pocketot-v045-artifact.zip -d /tmp/pocketot-v045-artifact
          test -f /tmp/pocketot-v045-artifact/PocketOT-v0.4.5-week-timeline-remind-items-source.zip
          mkdir -p /tmp/pocketot
          unzip -q /tmp/pocketot-v045-artifact/PocketOT-v0.4.5-week-timeline-remind-items-source.zip -d /tmp/pocketot
          test -f /tmp/pocketot/source/settings.gradle

      - name: Apply approved icon and adaptive safe zone
        shell: bash
        working-directory: /tmp/pocketot/source
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/.patch-v046-approved-icon/part*.b64 | base64 --decode > /tmp/pocketot-v046.patch.xz
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p = Path('/tmp/pocketot-v046.patch.xz')
          actual = sha256(p.read_bytes()).hexdigest()
          expected = '232e2b7d91685bb8bcd0975dec258b74cc7e8915fa849cdb116ef1accd4fe498'
          if actual != expected:
              raise SystemExit(f'Patch checksum mismatch: {actual}')
          print('Patch checksum:', actual)
          PY
          xz -dc /tmp/pocketot-v046.patch.xz > /tmp/pocketot-v046.patch
          git apply --binary --unsafe-paths /tmp/pocketot-v046.patch

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:left="20dp"
                  android:top="20dp"
                  android:right="20dp"
                  android:bottom="20dp">
                  <bitmap
                      android:src="@drawable/ic_launcher_foreground_bitmap"
                      android:gravity="fill" />
              </item>
          </layer-list>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_monochrome.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:left="20dp"
                  android:top="20dp"
                  android:right="20dp"
                  android:bottom="20dp">
                  <bitmap
                      android:src="@drawable/ic_launcher_monochrome_bitmap"
                      android:gravity="fill" />
              </item>
          </layer-list>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 10', 'versionCode 11')
          text = text.replace("versionName '0.4.6'", "versionName '0.4.6.1'")
          gradle.write_text(text, encoding='utf-8')

          app_js = Path('app/src/main/assets/www/app.js')
          text = app_js.read_text(encoding='utf-8')
          text = text.replace("const APP_VERSION = '0.4.6'", "const APP_VERSION = '0.4.6.1'")
          app_js.write_text(text, encoding='utf-8')

          bridge = Path('app/src/main/java/ca/otpocket/app/NativeBridge.java')
          text = bridge.read_text(encoding='utf-8')
          text = text.replace('return "0.4.6-dev"', 'return "0.4.6.1-dev"')
          bridge.write_text(text, encoding='utf-8')
          PY

          grep -q "versionName '0.4.6.1'" app/build.gradle
          grep -q "versionCode 11" app/build.gradle
          grep -q "const APP_VERSION = '0.4.6.1'" app/src/main/assets/www/app.js
          grep -q 'return "0.4.6.1-dev"' app/src/main/java/ca/otpocket/app/NativeBridge.java
          test -f app/src/main/res/drawable-nodpi/ic_launcher_foreground_bitmap.webp
          test -f app/src/main/res/drawable-nodpi/ic_launcher_monochrome_bitmap.webp
          grep -q 'android:left="20dp"' app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q 'android:bottom="20dp"' app/src/main/res/drawable/ic_launcher_monochrome.xml
          node --check app/src/main/assets/www/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.4.6.1 debug APK
        shell: bash
        working-directory: /tmp/pocketot/source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/source
          APK=dist/PocketOT-v0.4.6.1-approved-icon-safezone-debug.apk
          cp /tmp/pocketot/source/app/build/outputs/apk/debug/app-debug.apk "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/APK_BADGING.txt
          grep -q "package: name='ca.otpocket.app.dev'" dist/APK_BADGING.txt
          grep -q "versionName='0.4.6.1-dev'" dist/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > dist/APK_RESOURCES.txt
          grep -q 'ic_launcher_foreground_bitmap' dist/APK_RESOURCES.txt
          grep -q 'ic_launcher_monochrome_bitmap' dist/APK_RESOURCES.txt
          shasum -a 256 "$APK" > dist/PocketOT-v0.4.6.1-approved-icon-safezone-debug.apk.sha256
          cp -a /tmp/pocketot/source/. dist/source/
          rm -rf dist/source/.gradle dist/source/build dist/source/app/build
          cd dist
          zip -qr PocketOT-v0.4.6.1-approved-icon-safezone-source.zip source
          shasum -a 256 PocketOT-v0.4.6.1-approved-icon-safezone-source.zip > PocketOT-v0.4.6.1-approved-icon-safezone-source.zip.sha256

      - name: Upload v0.4.6.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.4.6.1-approved-icon-safezone-macos-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
