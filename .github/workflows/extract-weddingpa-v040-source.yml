name: Extract WeddingPA v0.4.0 Source

on:
  push:
    branches:
      - automation/weddingpa-v0.4.0-polish
    paths:
      - '.github/workflows/extract-weddingpa-v040-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/weddingpa-v0.4.0-polish
          fetch-depth: 0
      - name: Reconstruct v0.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat .weddingpa-v030-source/part*.b64 | base64 --decode > /tmp/weddingpa-v030-source.zip
          echo 'a40e2184ba8ef5ae70ca6b11b31e168bc613ae21d7e2ff46aadc34f355dfc299  /tmp/weddingpa-v030-source.zip' | sha256sum -c -
          rm -rf /tmp/weddingpa-v040 .weddingpa-v040-src
          mkdir -p /tmp/weddingpa-v040 .weddingpa-v040-src
          unzip -q /tmp/weddingpa-v030-source.zip -d /tmp/weddingpa-v040
          cp -a /tmp/weddingpa-v040/. .weddingpa-v040-src/
          find .weddingpa-v040-src -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .weddingpa-v040-src
          if git diff --cached --quiet; then
            echo 'Source already extracted.'
            exit 0
          fi
          git commit -m 'chore: expose WeddingPA source for v0.4.0 polish'
          git push origin HEAD:automation/weddingpa-v0.4.0-polish
