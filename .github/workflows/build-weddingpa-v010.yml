name: Build Wedding PA v0.3.0

on:
  push:
    branches:
      - automation/weddingpa-v0.3.0-wifi-dual
    paths:
      - '.github/workflows/build-weddingpa-v010.yml'
      - '.weddingpa-v030-source/**'
      - '.weddingpa-signing/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify WeddingPA v0.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/weddingpa-v030-source.zip
          ROOT=/tmp/weddingpa-v030
          cat .weddingpa-v030-source/part*.b64 | base64 --decode > "$ZIP"
          echo 'a40e2184ba8ef5ae70ca6b11b31e168bc613ae21d7e2ff46aadc34f355dfc299  /tmp/weddingpa-v030-source.zip' | sha256sum -c -
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "$ZIP" -d "$ROOT"

          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/MainActivity.kt"
          test -f "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/AudioPassthroughService.kt"
          test -f "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/NetworkPcmSender.kt"
          test -f "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/NetworkAudioReceiverService.kt"
          test -f "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/MusicPcmSource.kt"

          grep -q 'compileSdk = 36' "$ROOT/app/build.gradle.kts"
          grep -q 'targetSdk = 36' "$ROOT/app/build.gradle.kts"
          grep -q 'versionCode = 3' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.3.0"' "$ROOT/app/build.gradle.kts"
          grep -q 'WEDDINGPA_DISCOVER_V3' "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/MainActivity.kt"
          grep -q 'MULTI_OUTPUT_WIFI_MASTER' "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/AudioPassthroughService.kt"
          grep -q 'class NetworkAudioReceiverService' "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/NetworkAudioReceiverService.kt"
          grep -q 'class MusicPcmSource' "$ROOT/app/src/main/kotlin/app/weddingpa/mobile/MusicPcmSource.kt"

      - name: Reconstruct stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .weddingpa-signing/weddingpa-stable-dev.jks.b64 > /tmp/weddingpa-stable-dev.jks
          echo '07b663896b6f8a75d2161fe237fe1091cb66dd19ca196154bdb16ecd4fcc01f5  /tmp/weddingpa-stable-dev.jks' | sha256sum -c -
          export KEYPASS
          KEYPASS=$(git show 0de31c81d708189dcf7013c1449ce0e8fe743d47:.github/workflows/build-weddingpa-v010.yml | sed -n "s/.*-storepass '\([^']*\)'.*/\1/p" | head -1)
          test -n "$KEYPASS"
          keytool -list -v -keystore /tmp/weddingpa-stable-dev.jks -storepass "$KEYPASS" -alias weddingpa | tee /tmp/WEDDINGPA_KEY_INFO.txt
          grep -q 'C7:D8:99:3A:39:18:F6:D9:52:6E:69:3A:CF:2B:FD:2F:78:23:ED:A8:48:68:A9:C6:76:FB:44:C7:9E:9D:C1:28' /tmp/WEDDINGPA_KEY_INFO.txt
          printf '%s' "$KEYPASS" > /tmp/weddingpa-keypass
          chmod 600 /tmp/weddingpa-keypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build unsigned WeddingPA v0.3.0 release APK
        working-directory: /tmp/weddingpa-v030
        run: gradle :app:assembleRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.vfs.watch=false

      - name: Align, sign, validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/weddingpa-v030
          UNSIGNED="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED=/tmp/WeddingPA-v0.3.0-aligned.apk
          FINAL=dist/WeddingPA-v0.3.0.apk
          EXPECTED_CERT=C7D8993A3918F6D9526E693ACF2BFD2F7823EDA84868A9C676FB44C79E9DC128
          export KEYPASS
          KEYPASS=$(cat /tmp/weddingpa-keypass)

          test -f "$UNSIGNED"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/weddingpa-stable-dev.jks \
            --ks-key-alias weddingpa \
            --ks-pass env:KEYPASS \
            --key-pass env:KEYPASS \
            --out "$FINAL" \
            "$ALIGNED"

          unzip -t "$FINAL" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$FINAL" > dist/ZIPALIGN_CHECK.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$FINAL" | tee dist/APK_BADGING.txt
          grep -q "package: name='app.weddingpa.mobile'" dist/APK_BADGING.txt
          grep -q "versionCode='3'" dist/APK_BADGING.txt
          grep -q "versionName='0.3.0'" dist/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee dist/APK_SIGNATURE.txt
          CERT=$(grep 'Signer #1 certificate SHA-256 digest:' dist/APK_SIGNATURE.txt | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > dist/STABLE_SIGNING_CERT_SHA256.txt
          cp /tmp/WEDDINGPA_KEY_INFO.txt dist/STABLE_SIGNING_KEY_INFO.txt
          sha256sum "$FINAL" > dist/APK_SHA256.txt
          cp "$ROOT/QA_REPORT.txt" dist/QA_REPORT.txt

      - name: Upload stable-signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeddingPA-v0.3.0-stable-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
