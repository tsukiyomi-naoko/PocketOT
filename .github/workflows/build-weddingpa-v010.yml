name: Build Wedding PA v0.1.0

on:
  push:
    branches:
      - automation/weddingpa-v0.1.0-build
    paths:
      - '.github/workflows/build-weddingpa-v010.yml'
      - '.weddingpa-v010-source/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source carrier
        uses: actions/checkout@v4

      - name: Reconstruct exact WeddingPA source
        shell: bash
        run: |
          set -euo pipefail
          cat .weddingpa-v010-source/part*.b64 | base64 --decode > /tmp/weddingpa-v010-source.zip
          echo '03e699895492c7be564066d7d522b1c8edb986a4f9d4ca676c3b551a9a42007e  /tmp/weddingpa-v010-source.zip' | sha256sum -c -
          rm -rf /tmp/weddingpa-v010
          mkdir -p /tmp/weddingpa-v010
          unzip -q /tmp/weddingpa-v010-source.zip -d /tmp/weddingpa-v010
          test -f /tmp/weddingpa-v010/settings.gradle.kts
          test -f /tmp/weddingpa-v010/app/build.gradle.kts
          # API 37 is not published in the stable SDK repository yet. WeddingPA
          # only uses APIs available on the Pixel 10 Pro / Android 16, so build
          # v0.1.0 against stable API 36 instead of a preview SDK.
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/weddingpa-v010/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' /tmp/weddingpa-v010/app/build.gradle.kts
          grep -q 'compileSdk = 36' /tmp/weddingpa-v010/app/build.gradle.kts
          grep -q 'targetSdk = 36' /tmp/weddingpa-v010/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build WeddingPA debug APK
        working-directory: /tmp/weddingpa-v010
        run: gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.vfs.watch=false

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/weddingpa-v010
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/WeddingPA-v0.1.0-debug.apk
          unzip -t dist/WeddingPA-v0.1.0-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/WeddingPA-v0.1.0-debug.apk | tee dist/APK_BADGING.txt
          grep -q "package: name='app.weddingpa.mobile'" dist/APK_BADGING.txt
          grep -q "versionName='0.1.0'" dist/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/WeddingPA-v0.1.0-debug.apk | tee dist/APK_SIGNATURE.txt
          sha256sum dist/WeddingPA-v0.1.0-debug.apk > dist/APK_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeddingPA-v0.1.0-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
