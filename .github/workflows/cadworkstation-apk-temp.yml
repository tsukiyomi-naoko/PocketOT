name: Build CadWorkstation APK

on:
  push:
    branches: [cadworkstation-apk-build]
    paths:
      - '.cadws-source/**'
      - '.github/workflows/cadworkstation-apk-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-cadworkstation-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact CadWorkstation source
        shell: bash
        run: |
          set -euo pipefail
          echo '214f2eafbcb49075176d30ec21993463a8c3bb19d4397d94fd88ea3ab6e70dfc  .cadws-source/part05c2a.b64' | sha256sum -c -
          echo '6118a2f7ccce05d4a23fb2734e12ebae3d39c8529d0816d04f615cbfd2ba2445  .cadws-source/part05c2b.b64' | sha256sum -c -
          echo '4c43d0f568d60260be04e6689ddb624c46f3dcd537b84edd7b81fc8b9f05cd54  .cadws-source/part05c2c.b64' | sha256sum -c -
          echo 'c2583abdfa01d8b1b358304d842b6cb439ee3a5f1888d96da5f922de33cdb71e  .cadws-source/part05c2d.b64' | sha256sum -c -
          cat \
            .cadws-source/part00.b64 \
            .cadws-source/part01.b64 \
            .cadws-source/part02.b64 \
            .cadws-source/part03.b64 \
            .cadws-source/part04.b64 \
            .cadws-source/part05a.b64 \
            .cadws-source/part05b.b64 \
            .cadws-source/part05c0.b64 \
            .cadws-source/part05c1.b64 \
            .cadws-source/part05c2a.b64 \
            .cadws-source/part05c2b.b64 \
            .cadws-source/part05c2c.b64 \
            .cadws-source/part05c2d.b64 \
            .cadws-source/part06.b64 \
            | base64 --decode > /tmp/cadws.zip
          echo 'ba9b26ca33e0ed0ea11af965af39adcf5b897488d44fd7c4eca48c18b28adcce  /tmp/cadws.zip' | sha256sum -c -
          rm -rf /tmp/cadws
          mkdir -p /tmp/cadws
          unzip -q /tmp/cadws.zip -d /tmp/cadws
          test -f /tmp/cadws/CadWorkstation-v0.1.0-alpha1-ci/android/settings.gradle.kts
          # GitHub's current SDK repository does not expose platform 37 yet.
          # The application already targets API 36; compile this test alpha against API 36 too.
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/cadws/CadWorkstation-v0.1.0-alpha1-ci/android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform, NDK and CMake using preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.31.6'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|ndk;28.2.13676358|cmake;3.31.6'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: /tmp/cadws/CadWorkstation-v0.1.0-alpha1-ci/android
        env:
          CADWS_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/cadws/CadWorkstation-v0.1.0-alpha1-ci/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/CadWorkstation-v0.1.0-alpha1-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/CadWorkstation-v0.1.0-alpha1-debug.apk
          unzip -t dist/CadWorkstation-v0.1.0-alpha1-debug.apk >/dev/null
          sha256sum dist/CadWorkstation-v0.1.0-alpha1-debug.apk > dist/CadWorkstation-v0.1.0-alpha1-debug.apk.sha256
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CadWorkstation-v0.1.0-alpha1-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 7
