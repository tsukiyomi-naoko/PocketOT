name: Build Pocket OT v0.4.9 dev6 Permanently Signed APK

on:
  push:
    branches:
      - agent/pocket-ot2-v049
    paths:
      - '.github/workflows/build-pocket-ot2-v049-dev6-signed.yml'
      - '.github/DEV6_BUILD_TRIGGER.txt'
      - '.patch-v049-dev6/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POCKET_OT_KEYSTORE_B64: ${{ secrets.POCKET_OT_KEYSTORE_B64 }}
      POCKET_OT_KEYSTORE_PASSWORD: ${{ secrets.POCKET_OT_KEYSTORE_PASSWORD }}
      POCKET_OT_KEY_ALIAS: ${{ secrets.POCKET_OT_KEY_ALIAS }}
      POCKET_OT_KEY_PASSWORD: ${{ secrets.POCKET_OT_KEY_PASSWORD }}

    steps:
      - name: Check out Pocket OT2 branch
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POCKET_OT_KEYSTORE_B64"
          test -n "$POCKET_OT_KEYSTORE_PASSWORD"
          test -n "$POCKET_OT_KEY_ALIAS"
          test -n "$POCKET_OT_KEY_PASSWORD"

      - name: Download verified dev5 built source
        uses: actions/download-artifact@v4
        with:
          name: PocketOT-v0.4.9-dev5-table-report-backup-permasigned-apk
          path: /tmp/dev5-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32038932763

      - name: Unpack dev5 source
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/dev5-artifact/PocketOT-v0.4.9-dev5-built-source.zip
          rm -rf /tmp/pocketot-v049-dev6
          mkdir -p /tmp/pocketot-v049-dev6
          unzip -q /tmp/dev5-artifact/PocketOT-v0.4.9-dev5-built-source.zip -d /tmp/pocketot-v049-dev6
          test -f /tmp/pocketot-v049-dev6/source/app/build.gradle
          echo 'POCKETOT_ROOT=/tmp/pocketot-v049-dev6/source' >> "$GITHUB_ENV"

      - name: Apply dev6 Settings renderer fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patch-v049-dev6/chunk00 > /tmp/pocketot-v049-dev6.patch.xz
          echo 'ac5eb92292352c2093abe95a104d952be5029d810c316168b7935cb7e9733431  /tmp/pocketot-v049-dev6.patch.xz' | sha256sum -c -
          xz -dc /tmp/pocketot-v049-dev6.patch.xz > /tmp/pocketot-v049-dev6.patch
          cd "$POCKETOT_ROOT"
          git apply --check /tmp/pocketot-v049-dev6.patch
          git apply /tmp/pocketot-v049-dev6.patch
          grep -q "const APP_VERSION = '0.4.9-dev6'" app/src/main/assets/www/app.js
          grep -q '<button id="restoreBackupButton" class="btn secondary">Restore backup</button>' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js

      - name: Configure dev6 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['POCKETOT_ROOT'])

          gradle = root / 'app/build.gradle'
          text = gradle.read_text(encoding='utf-8')
          if "versionName '0.4.9-dev5'" not in text or 'versionCode 20' not in text:
              raise SystemExit('Unexpected dev5 metadata')
          text = text.replace('versionCode 20', 'versionCode 21', 1)
          text = text.replace("versionName '0.4.9-dev5'", "versionName '0.4.9-dev6'", 1)
          gradle.write_text(text, encoding='utf-8')

          bridge = root / 'app/src/main/java/ca/otpocket/app/NativeBridge.java'
          bridge.write_text(bridge.read_text(encoding='utf-8').replace('return "0.4.9-dev5";', 'return "0.4.9-dev6";'), encoding='utf-8')

          backup = root / 'app/src/main/java/ca/otpocket/app/BackupUtil.java'
          backup.write_text(backup.read_text(encoding='utf-8').replace('manifest.put("appVersion", "0.4.9-dev5");', 'manifest.put("appVersion", "0.4.9-dev6");'), encoding='utf-8')
          PY
          grep -q 'versionCode 21' "$POCKETOT_ROOT/app/build.gradle"
          grep -q "versionName '0.4.9-dev6'" "$POCKETOT_ROOT/app/build.gradle"
          grep -q 'return "0.4.9-dev6";' "$POCKETOT_ROOT/app/src/main/java/ca/otpocket/app/NativeBridge.java"

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$POCKET_OT_KEYSTORE_B64" | base64 --decode > /tmp/PocketOT-release.jks
          keytool -list -keystore /tmp/PocketOT-release.jks -storepass "$POCKET_OT_KEYSTORE_PASSWORD" -alias "$POCKET_OT_KEY_ALIAS" >/dev/null
          echo 'POCKET_OT_KEYSTORE_PATH=/tmp/PocketOT-release.jks' >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build permanently signed APK
        shell: bash
        working-directory: ${{ env.POCKETOT_ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate permanent signature and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/source
          APK=dist/PocketOT-v0.4.9-dev6-permasigned.apk
          cp "$POCKETOT_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/APK_SIGNATURE.txt
          grep -qi '0ac7bfb8d4af7d0c50f0c5a6b5270d1cc26aa2056e7b18c4a4931cf6d86ea365' dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/APK_BADGING.txt
          grep -q "package: name='ca.otpocket.app.dev'" dist/APK_BADGING.txt
          grep -q "versionCode='21'" dist/APK_BADGING.txt
          grep -q "versionName='0.4.9-dev6'" dist/APK_BADGING.txt
          sha256sum "$APK" > dist/PocketOT-v0.4.9-dev6-permasigned.apk.sha256
          cp -a "$POCKETOT_ROOT"/. dist/source/
          rm -rf dist/source/.gradle dist/source/build dist/source/app/build
          cd dist
          zip -qr PocketOT-v0.4.9-dev6-built-source.zip source
          sha256sum PocketOT-v0.4.9-dev6-built-source.zip > PocketOT-v0.4.9-dev6-built-source.zip.sha256

      - name: Upload permanently signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.4.9-dev6-settings-fix-permasigned-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
