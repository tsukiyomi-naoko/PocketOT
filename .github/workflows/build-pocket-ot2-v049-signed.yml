name: Build Pocket OT v0.4.9 dev3 Permanently Signed APK

on:
  push:
    branches:
      - agent/pocket-ot2-v049
    paths:
      - '.github/SIGNED_BUILD_TRIGGER.txt'
      - '.github/workflows/build-pocket-ot2-v049-signed.yml'
      - '.patch-v049-dev2/**'
      - '.patch-v049-dev3-presign/**'
      - 'PocketOT-v0.4.9-dev1-source.zip'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POCKET_OT_KEYSTORE_B64: ${{ secrets.POCKET_OT_KEYSTORE_B64 }}
      POCKET_OT_KEYSTORE_PASSWORD: ${{ secrets.POCKET_OT_KEYSTORE_PASSWORD }}
      POCKET_OT_KEY_ALIAS: ${{ secrets.POCKET_OT_KEY_ALIAS }}
      POCKET_OT_KEY_PASSWORD: ${{ secrets.POCKET_OT_KEY_PASSWORD }}

    steps:
      - name: Check out Pocket OT2 branch
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POCKET_OT_KEYSTORE_B64"
          test -n "$POCKET_OT_KEYSTORE_PASSWORD"
          test -n "$POCKET_OT_KEY_ALIAS"
          test -n "$POCKET_OT_KEY_PASSWORD"

      - name: Verify and unpack dev1 source
        shell: bash
        run: |
          set -euo pipefail
          echo '13cc63e1592e5effa647c6788c357aedb7a19ec1cc8c9574ce1080b8fbf19f5a  PocketOT-v0.4.9-dev1-source.zip' | sha256sum -c -
          rm -rf /tmp/pocketot-v049
          mkdir -p /tmp/pocketot-v049
          unzip -q PocketOT-v0.4.9-dev1-source.zip -d /tmp/pocketot-v049
          ROOT="$(dirname "$(find /tmp/pocketot-v049 -name settings.gradle -print -quit)")"
          test -n "$ROOT"
          test -f "$ROOT/app/build.gradle"
          echo "POCKETOT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply v0.4.9 dev2 ZIP restore patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patch-v049-dev2/patch.xz.b64 > /tmp/pocketot-v049-dev2.patch.xz
          echo 'fbaf4b4db52695b3770abc96c873de893cd57f312d5e4a69111a06fe723dbc75  /tmp/pocketot-v049-dev2.patch.xz' | sha256sum -c -
          xz -dc /tmp/pocketot-v049-dev2.patch.xz > /tmp/pocketot-v049-dev2.patch
          cd "$POCKETOT_ROOT"
          git apply --check /tmp/pocketot-v049-dev2.patch
          git apply /tmp/pocketot-v049-dev2.patch
          grep -q 'versionCode 17' app/build.gradle
          grep -q "versionName '0.4.9-dev2'" app/build.gradle
          grep -q 'restoreSelectedFullBackup' app/src/main/java/ca/otpocket/app/NativeBridge.java
          test -f app/src/main/java/ca/otpocket/app/BackupRestoreUtil.java
          node --check app/src/main/assets/www/app.js

      - name: Apply v0.4.9 dev3 keyboard metadata and picker patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .patch-v049-dev3-presign/chunk00 \
            .patch-v049-dev3-presign/chunk01 \
            .patch-v049-dev3-presign/chunk02 \
            .patch-v049-dev3-presign/chunk03 \
            .patch-v049-dev3-presign/chunk04 \
            > /tmp/pocketot-v049-dev3.patch.xz.b64
          base64 --decode /tmp/pocketot-v049-dev3.patch.xz.b64 > /tmp/pocketot-v049-dev3.patch.xz
          echo '67539fcbc20697b60138478fa1fbb4b3a52ac6a1e9bd5fcb47190f68595ccfee  /tmp/pocketot-v049-dev3.patch.xz' | sha256sum -c -
          xz -dc /tmp/pocketot-v049-dev3.patch.xz > /tmp/pocketot-v049-dev3.patch
          cd "$POCKETOT_ROOT"
          git apply --check /tmp/pocketot-v049-dev3.patch
          git apply /tmp/pocketot-v049-dev3.patch
          grep -q 'versionCode 18' app/build.gradle
          grep -q "versionName '0.4.9-dev3'" app/build.gradle
          grep -q 'ACTION_PICK_IMAGES' app/src/main/java/ca/otpocket/app/MainActivity.java
          grep -q 'readCaptureTimestampIso' app/src/main/java/ca/otpocket/app/ImageUtil.java
          grep -q 'OTPocketImeChanged' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$POCKET_OT_KEYSTORE_B64" | base64 --decode > /tmp/PocketOT-release.jks
          keytool -list -keystore /tmp/PocketOT-release.jks -storepass "$POCKET_OT_KEYSTORE_PASSWORD" -alias "$POCKET_OT_KEY_ALIAS" >/dev/null
          echo "POCKET_OT_KEYSTORE_PATH=/tmp/PocketOT-release.jks" >> "$GITHUB_ENV"

      - name: Configure permanent signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['POCKETOT_ROOT'])
          gradle = root / 'app/build.gradle'
          text = gradle.read_text(encoding='utf-8')
          if "versionName '0.4.9-dev3'" not in text or 'versionCode 18' not in text:
              raise SystemExit('Unexpected Pocket OT dev3 version metadata')
          text = text.replace("            versionNameSuffix '-dev'\n", '')
          marker = '    buildTypes {\n'
          signing = '''    signingConfigs {\n        pocketOtPermanent {\n            storeFile file(System.getenv("POCKET_OT_KEYSTORE_PATH"))\n            storePassword System.getenv("POCKET_OT_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("POCKET_OT_KEY_ALIAS")\n            keyPassword System.getenv("POCKET_OT_KEY_PASSWORD")\n        }\n    }\n\n'''
          if signing not in text:
              text = text.replace(marker, signing + marker)
          text = text.replace("        debug {\n            applicationIdSuffix '.dev'", "        debug {\n            signingConfig signingConfigs.pocketOtPermanent\n            applicationIdSuffix '.dev'")
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build permanently signed APK
        shell: bash
        working-directory: ${{ env.POCKETOT_ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate permanent signature and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/source
          APK=dist/PocketOT-v0.4.9-dev3-permasigned.apk
          cp "$POCKETOT_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/APK_SIGNATURE.txt
          grep -qi '0ac7bfb8d4af7d0c50f0c5a6b5270d1cc26aa2056e7b18c4a4931cf6d86ea365' dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/APK_BADGING.txt
          grep -q "package: name='ca.otpocket.app.dev'" dist/APK_BADGING.txt
          grep -q "versionCode='18'" dist/APK_BADGING.txt
          grep -q "versionName='0.4.9-dev3'" dist/APK_BADGING.txt
          sha256sum "$APK" > dist/PocketOT-v0.4.9-dev3-permasigned.apk.sha256
          cp -a "$POCKETOT_ROOT"/. dist/source/
          rm -rf dist/source/.gradle dist/source/build dist/source/app/build
          cd dist
          zip -qr PocketOT-v0.4.9-dev3-built-source.zip source
          sha256sum PocketOT-v0.4.9-dev3-built-source.zip > PocketOT-v0.4.9-dev3-built-source.zip.sha256

      - name: Upload permanently signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.4.9-dev3-ime-exif-picker-permasigned-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
