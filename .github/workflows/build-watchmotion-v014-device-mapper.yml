name: Build Watch Motion Controller v0.1.4 Device Mapper

on:
  push:
    branches:
      - automation/watchmotion-v0.1.4-device-mapper-build
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-watchmotion-v014:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact v0.1.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat .watchmotion-v014-source/part*.b64 | base64 --decode > /tmp/watchmotion-v014-source.zip
          echo '2243d0481a69d39454af488f91c4d213291093048ae6fe38716a0b270c59f8af  /tmp/watchmotion-v014-source.zip' | sha256sum -c -
          mkdir -p /tmp/watchmotion-v014
          unzip -q /tmp/watchmotion-v014-source.zip -d /tmp/watchmotion-v014
          ROOT=/tmp/watchmotion-v014/source
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/signing/watchmotion-dev.jks"
          test -f "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          test -f "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/DeviceStore.kt"
          test -f "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/GestureMappingStore.kt"
          grep -q 'versionName = "0.1.4"' "$ROOT/phone/build.gradle.kts"
          grep -q 'versionName = "0.1.4"' "$ROOT/wear/build.gradle.kts"
          grep -q '239.255.255.250' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q '_googlecast._tcp.' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q 'Scan Wi-Fi for TVs' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/MainActivity.kt"
          grep -q 'TV_WAKE' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/GestureMappingStore.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build phone and Wear OS APKs
        working-directory: /tmp/watchmotion-v014/source
        run: gradle :phone:assembleDebug :wear:assembleDebug --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.vfs.watch=false

      - name: Validate and package APKs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/watchmotion-v014/source
          mkdir -p dist/source
          PHONE=dist/WatchMotionController-Phone-v0.1.4.apk
          WEAR=dist/WatchMotionController-Wear-v0.1.4.apk
          EXPECTED_CERT=699A9091FE0D6625D555902FF21C881FDA70BA6803A43DBD2A02B212C94C6746

          cp "$ROOT/phone/build/outputs/apk/debug/phone-debug.apk" "$PHONE"
          cp "$ROOT/wear/build/outputs/apk/debug/wear-debug.apk" "$WEAR"

          unzip -t "$PHONE" >/dev/null
          unzip -t "$WEAR" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PHONE" | tee dist/PHONE_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$WEAR" | tee dist/WEAR_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/PHONE_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/WEAR_SIGNATURE.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PHONE" | tee dist/PHONE_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$WEAR" | tee dist/WEAR_BADGING.txt
          grep -q "package: name='com.irisproxima.watchmotion'" dist/PHONE_BADGING.txt
          grep -q "versionName='0.1.4'" dist/PHONE_BADGING.txt
          grep -q "package: name='com.irisproxima.watchmotion'" dist/WEAR_BADGING.txt
          grep -q "versionName='0.1.4'" dist/WEAR_BADGING.txt

          PHONE_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' dist/PHONE_SIGNATURE.txt | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          WEAR_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' dist/WEAR_SIGNATURE.txt | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$PHONE_CERT"
          test "$PHONE_CERT" = "$WEAR_CERT"
          test "$PHONE_CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$PHONE_CERT" > dist/STABLE_SIGNING_CERT_SHA256.txt

          sha256sum "$PHONE" "$WEAR" > dist/APK_SHA256.txt

          cp -a "$ROOT"/. dist/source/
          rm -rf dist/source/.git dist/source/.gradle dist/source/phone/build dist/source/wear/build dist/source/dist
          cd dist
          zip -qr WatchMotionController-v0.1.4-DeviceMapper-source.zip source
          sha256sum WatchMotionController-v0.1.4-DeviceMapper-source.zip > WatchMotionController-v0.1.4-DeviceMapper-source.zip.sha256

      - name: Upload Watch Motion Controller v0.1.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchMotionController-v0.1.4-DeviceMapper
          path: dist/
          if-no-files-found: error
          retention-days: 30
