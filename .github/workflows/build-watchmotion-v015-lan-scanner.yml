name: Build Watch Motion Controller v0.1.5 LAN Scanner

on:
  push:
    branches:
      - automation/watchmotion-v0.1.5-lan-scanner-build
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-watchmotion-v015:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.1.4 base and apply v0.1.5 patch
        shell: bash
        run: |
          set -euo pipefail

          cat .watchmotion-v014-source/part*.b64 | base64 --decode > /tmp/watchmotion-v014-source.zip
          echo '2243d0481a69d39454af488f91c4d213291093048ae6fe38716a0b270c59f8af  /tmp/watchmotion-v014-source.zip' | sha256sum -c -

          rm -rf /tmp/watchmotion_v014_src /tmp/watchmotion_v015_work
          mkdir -p /tmp/watchmotion_v014_src /tmp/watchmotion_v015_work
          unzip -q /tmp/watchmotion-v014-source.zip -d /tmp/watchmotion_v014_src

          cat .watchmotion-v015-patch/patch* > /tmp/watchmotion-v014-to-v015.patch
          echo '52c7ccb92e916535ac44fb9bbb20e9df05e78cb5149773e3582fcc9fa5c136f9  /tmp/watchmotion-v014-to-v015.patch' | sha256sum -c -

          cd /tmp
          patch --batch --forward -p0 < /tmp/watchmotion-v014-to-v015.patch

          ROOT=/tmp/watchmotion_v014_src/source
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/signing/watchmotion-dev.jks"
          grep -q 'versionName = "0.1.5"' "$ROOT/phone/build.gradle.kts"
          grep -q 'versionName = "0.1.5"' "$ROOT/wear/build.gradle.kts"
          grep -q 'startActiveLanProbe()' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q 'isPortOpen(host, 3000' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q 'isPortOpen(host, 3001' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q 'query/device-info' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt"
          grep -q 'Scanning SSDP + Cast + active LAN TV endpoints' "$ROOT/phone/src/main/java/com/irisproxima/watchmotion/MainActivity.kt"

          echo '0bd67cecdbc0ba7d81f15b4f22a13960020ad4126b46de0f0314cdaf9facbb48  /tmp/watchmotion_v014_src/source/phone/src/main/java/com/irisproxima/watchmotion/LanDeviceScanner.kt' | sha256sum -c -
          echo '6f5bc61ba6cb2c80f7623bb33f6f699244887242bf3f0fa7557ae7f68016a086  /tmp/watchmotion_v014_src/source/phone/src/main/java/com/irisproxima/watchmotion/MainActivity.kt' | sha256sum -c -
          echo 'd80a64f87baf1ebda324d8656ecff1ee6f21d9121cae49fd97384394e0e35aa9  /tmp/watchmotion_v014_src/source/phone/build.gradle.kts' | sha256sum -c -
          echo '3ef5c2dccfca7daa112ce83d42a6030fa40e014e3e3083e548b1b1eeb248b6de  /tmp/watchmotion_v014_src/source/wear/build.gradle.kts' | sha256sum -c -

          cd /tmp/watchmotion_v014_src
          TREE_HASH=$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --exclude='./source/.gradle' --exclude='./source/.kotlin' -cf - source | sha256sum | awk '{print $1}')
          test "$TREE_HASH" = '0b1f70f2673e761083f62b42bd42e8b7ef55184ced47c924ebf26febb167d6be'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build phone and Wear OS APKs
        working-directory: /tmp/watchmotion_v014_src/source
        run: gradle :phone:assembleDebug :wear:assembleDebug --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.vfs.watch=false

      - name: Validate and package APKs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/watchmotion_v014_src/source
          mkdir -p dist/source
          PHONE=dist/WatchMotionController-Phone-v0.1.5.apk
          WEAR=dist/WatchMotionController-Wear-v0.1.5.apk
          EXPECTED_CERT=699A9091FE0D6625D555902FF21C881FDA70BA6803A43DBD2A02B212C94C6746

          cp "$ROOT/phone/build/outputs/apk/debug/phone-debug.apk" "$PHONE"
          cp "$ROOT/wear/build/outputs/apk/debug/wear-debug.apk" "$WEAR"

          unzip -t "$PHONE" >/dev/null
          unzip -t "$WEAR" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PHONE" | tee dist/PHONE_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$WEAR" | tee dist/WEAR_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/PHONE_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/WEAR_SIGNATURE.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PHONE" | tee dist/PHONE_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$WEAR" | tee dist/WEAR_BADGING.txt
          grep -q "package: name='com.irisproxima.watchmotion'" dist/PHONE_BADGING.txt
          grep -q "versionName='0.1.5'" dist/PHONE_BADGING.txt
          grep -q "package: name='com.irisproxima.watchmotion'" dist/WEAR_BADGING.txt
          grep -q "versionName='0.1.5'" dist/WEAR_BADGING.txt

          PHONE_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' dist/PHONE_SIGNATURE.txt | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          WEAR_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' dist/WEAR_SIGNATURE.txt | head -1 | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$PHONE_CERT"
          test "$PHONE_CERT" = "$WEAR_CERT"
          test "$PHONE_CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$PHONE_CERT" > dist/STABLE_SIGNING_CERT_SHA256.txt

          sha256sum "$PHONE" "$WEAR" > dist/APK_SHA256.txt

          cp -a "$ROOT"/. dist/source/
          rm -rf dist/source/.git dist/source/.gradle dist/source/.kotlin dist/source/phone/build dist/source/wear/build dist/source/dist
          cd dist
          zip -qr WatchMotionController-v0.1.5-LanScanner-source.zip source
          sha256sum WatchMotionController-v0.1.5-LanScanner-source.zip > WatchMotionController-v0.1.5-LanScanner-source.zip.sha256

      - name: Upload Watch Motion Controller v0.1.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchMotionController-v0.1.5-LanScanner
          path: dist/
          if-no-files-found: error
          retention-days: 30
