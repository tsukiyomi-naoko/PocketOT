name: Build PocketOT v0.4.7 Remember Photo APK

on:
  push:
    branches:
      - automation/pocketot-v0.4.7-remember-photo
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v047-remember-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out packaged source
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.4.7 source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-v047/part*.b64 | base64 --decode > /tmp/PocketOT-v0.4.7-source.zip
          echo '86d2452a73d1eb90b2c11dc5d77f3110d2f98bd50b34dca93f948a1cd7f483b5  /tmp/PocketOT-v0.4.7-source.zip' | sha256sum -c -
          mkdir -p /tmp/pocketot-v047
          unzip -q /tmp/PocketOT-v0.4.7-source.zip -d /tmp/pocketot-v047
          test -f /tmp/pocketot-v047/source/settings.gradle
          grep -q "versionName '0.4.7'" /tmp/pocketot-v047/source/app/build.gradle
          grep -q 'versionCode 12' /tmp/pocketot-v047/source/app/build.gradle
          grep -q "const APP_VERSION = '0.4.7'" /tmp/pocketot-v047/source/app/src/main/assets/www/app.js
          grep -q 'Picture (optional)' /tmp/pocketot-v047/source/app/src/main/assets/www/app.js
          grep -q 'memoryEditorDraftPhoto' /tmp/pocketot-v047/source/app/src/main/assets/www/app.js
          grep -q 'android:left="20dp"' /tmp/pocketot-v047/source/app/src/main/res/drawable/ic_launcher_foreground.xml
          node --check /tmp/pocketot-v047/source/app/src/main/assets/www/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.4.7 debug APK
        working-directory: /tmp/pocketot-v047/source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/PocketOT-v0.4.7-remember-photo-debug.apk
          cp /tmp/pocketot-v047/source/app/build/outputs/apk/debug/app-debug.apk "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/APK_BADGING.txt
          grep -q "package: name='ca.otpocket.app.dev'" dist/APK_BADGING.txt
          grep -q "versionName='0.4.7-dev'" dist/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > dist/APK_RESOURCES.txt
          grep -q 'ic_launcher_foreground_bitmap' dist/APK_RESOURCES.txt
          sha256sum "$APK" > dist/PocketOT-v0.4.7-remember-photo-debug.apk.sha256
          cp /tmp/PocketOT-v0.4.7-source.zip dist/PocketOT-v0.4.7-remember-photo-source.zip
          sha256sum dist/PocketOT-v0.4.7-remember-photo-source.zip > dist/PocketOT-v0.4.7-remember-photo-source.zip.sha256

      - name: Upload v0.4.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOT-v0.4.7-remember-photo-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
